<div class="space-y-6">
  <div class="flex items-start justify-between gap-4">
    <div class="min-w-0">
      <h1 class="truncate text-3xl font-bold tracking-tight text-plata-900">{{ evento?.nombre ?? 'Evento' }}</h1>
      <p *ngIf="evento" class="mt-1 text-base text-black/50">
        {{ evento.fecha }} · {{ evento.horaInicio }} – {{ evento.horaFin }}
      </p>
    </div>
    <a
      routerLink="/app/eventos"
      class="shrink-0 rounded-xl border border-plata-300 bg-white px-4 py-3 text-sm font-medium text-plata-700 hover:bg-plata-100"
    >
      Volver
    </a>
  </div>

  <p *ngIf="error" class="rounded-xl bg-red-50 px-4 py-3 text-sm text-red-600">{{ error }}</p>

  <nav class="flex gap-2 overflow-x-auto rounded-2xl border border-plata-200 bg-white p-1.5 shadow-sm">
    <button
      *ngFor="let s of secciones"
      type="button"
      (click)="seccion = s.id"
      class="flex-1 whitespace-nowrap rounded-xl px-3 py-3 text-sm font-medium sm:px-4"
      [ngClass]="seccion === s.id ? 'bg-black text-white' : 'text-plata-700 hover:bg-plata-100'"
    >
      {{ s.texto }}
    </button>
  </nav>

  <ng-container [ngSwitch]="seccion">
    <app-equipo-evento *ngSwitchCase="'equipo'" [eventoId]="eventoId" [editable]="puedeGestionar" />
    <app-cargos-evento *ngSwitchCase="'cargos'" [eventoId]="eventoId" [editable]="puedeGestionar" />
    <ng-container *ngSwitchCase="'invitados'">
      <p *ngIf="!cargosListo" class="text-base text-black/40">Cargando…</p>
      <app-invitados-evento
        *ngIf="cargosListo"
        [eventoId]="eventoId"
        [puedeMarcar]="puedeMarcarInvitados"
        [puedeVer]="true"
        [puedeSubir]="puedeSubirInvitados"
        [cargoId]="puedeGestionar ? null : cargoInvitadosId"
      />
    </ng-container>
    <app-tareas-evento *ngSwitchCase="'tareas'" [eventoId]="eventoId" [puedeGestionar]="puedeGestionar" />
  </ng-container>
</div>
